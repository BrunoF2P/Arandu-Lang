# Publish installable tarballs to a GitHub Release when a version tag is pushed.
#
# Tag convention: vX.Y.Z must match crates/arandu_cli Cargo.toml version.
# Example:
#   git tag v0.0.1 && git push origin v0.0.1
#
# Artifacts (per host target):
#   arandu-$VERSION-$TARGET.(tar.gz|zip) plus .blake3 and .blake3sum
#
# Install (example, Linux x86_64):
#   gh release download v0.0.1 -p 'arandu-*-x86_64-unknown-linux-gnu.tar.gz*'
#   bash scripts/install-from-tarball.sh ./arandu-0.0.1-x86_64-unknown-linux-gnu.tar.gz
#
# Manual package-only dry run: Actions → Release → Run workflow (dry_run=true).

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      note:
        description: "Optional note (workflow_dispatch only packages; no GitHub Release)"
        required: false
        default: "dry-run package matrix"

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  validate:
    name: S0 / Release gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install repository toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: release-gate-rust-1.97.1
      - run: cargo fetch --locked
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace --locked
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo run --locked -p xtask -- check-diag-docs
      - name: Component and tag version contract
        run: cargo run --locked -p xtask -- check-release-contract
      - name: Release archive security regressions
        run: python scripts/test_release_archives.py
      - run: git diff --exit-code

  package:
    name: Package (${{ matrix.target }})
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          # macos-latest is Apple Silicon (aarch64). macos-13 (Intel) was
          # retired by GitHub Dec 2025 — jobs sit forever "Waiting for a runner".
          # Intel Mac: install from source or cross-compile later; no hosted image.
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install repository toolchain
        run: rustup show active-toolchain

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: release-${{ matrix.target }}

      - name: Resolve VERSION (tag ↔ Cargo.toml)
        shell: bash
        run: |
          set -euo pipefail
          CARGO_V="$(
            sed -n 's/^version = "\([^"]*\)"/\1/p' crates/arandu_cli/Cargo.toml | head -1
          )"
          if [[ -z "$CARGO_V" ]]; then
            echo "error: could not read version from crates/arandu_cli/Cargo.toml" >&2
            exit 1
          fi

          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
            VERSION="${TAG#v}"
            if [[ "$VERSION" != "$CARGO_V" ]]; then
              echo "error: tag '${TAG}' implies VERSION=${VERSION}, but Cargo.toml has ${CARGO_V}" >&2
              echo "  bump crates to ${VERSION} (or retag to v${CARGO_V}) before releasing" >&2
              exit 1
            fi
          else
            # workflow_dispatch: package crate version only (no Release upload)
            VERSION="$CARGO_V"
          fi

          # package-release builds for the host; archive name must match the host triple.
          HOST="$(rustc -vV | sed -n 's/^host: //p')"
          if [[ "$HOST" != "${{ matrix.target }}" ]]; then
            echo "error: runner host is '${HOST}', matrix.target is '${{ matrix.target }}'" >&2
            echo "  no cross-compile yet — fix matrix OS/target pairing" >&2
            exit 1
          fi

          {
            echo "VERSION=${VERSION}"
            echo "TARGET=${{ matrix.target }}"
          } >>"$GITHUB_ENV"
          echo "packaging arandu-${VERSION}-${{ matrix.target }}"

      - name: package-release
        if: runner.os != 'Windows'
        shell: bash
        run: bash scripts/package-release.sh
        env:
          VERSION: ${{ env.VERSION }}
          TARGET: ${{ env.TARGET }}

      - name: package-release (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/package-release.ps1
        env:
          VERSION: ${{ env.VERSION }}
          TARGET: ${{ env.TARGET }}

      - name: List dist/
        shell: bash
        run: ls -la dist/

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: arandu-${{ env.VERSION }}-${{ matrix.target }}
          path: |
            dist/arandu-${{ env.VERSION }}-${{ matrix.target }}.${{ matrix.archive }}
            dist/arandu-${{ env.VERSION }}-${{ matrix.target }}.${{ matrix.archive }}.blake3
            dist/arandu-${{ env.VERSION }}-${{ matrix.target }}.${{ matrix.archive }}.blake3sum
            dist/arandu-${{ env.VERSION }}-${{ matrix.target }}.${{ matrix.archive }}.sha256
            dist/arandu-${{ env.VERSION }}-${{ matrix.target }}.${{ matrix.archive }}.sha256sum
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: package
    runs-on: ubuntu-latest
    # Only real version tags create a Release (not workflow_dispatch dry packages).
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download all packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release-assets
          pattern: arandu-*
          merge-multiple: true

      - name: Show assets
        run: find release-assets -type f | sort

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          # Defaults to the pushed tag (GITHUB_REF).
          name: Arandu ${{ github.ref_name }}
          draft: false
          # Honest pre-0.1: mark v0.0.* and any -rc/-beta as prerelease.
          prerelease: ${{ startsWith(github.ref_name, 'v0.0.') || contains(github.ref_name, '-') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-assets/*.tar.gz
            release-assets/*.zip
            release-assets/*.blake3
            release-assets/*.blake3sum
            release-assets/*.sha256
            release-assets/*.sha256sum
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
